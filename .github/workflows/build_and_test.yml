---
name: sst-hgcc build/test

# yamllint disable-line rule:truthy
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-14', 'ubuntu-24.04']
    env:
      INSTALL_PREFIX: ${{ github.workspace }}/install
    steps:
      - name: Install Mac dependencies
        if: runner.os == 'macOS'
        run: |
          brew install \
            autoconf \
            automake \
            libtool \
            lit \
            llvm@22 \
            open-mpi

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            libopenmpi-dev \
            libtool-bin \
            python3-dev \
            python3-pip \
            wget
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y \
            clang-22 \
            libclang-22-dev \
            libclang-cpp22-dev \
            llvm-22-dev
          python3 -m pip install lit

      - name: Clone core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: sst-core
          persist-credentials: false
          ref: devel
          repository: sstsimulator/sst-core

      - name: Clone elements
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: sst-elements
          persist-credentials: false
          ref: devel
          repository: sstsimulator/sst-elements

      - name: Clone hgcc
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: sst-hgcc
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: ${{ github.job }}-${{ matrix.os}}
          max-size: 5G

      - name: Set Mac environment
        if: runner.os == 'macOS'
        run: |
          echo "/usr/local/opt/ccache/libexec" >> "${GITHUB_PATH}"
          echo "LLVM_ROOT=/opt/homebrew/opt/llvm@22" >> "${GITHUB_ENV}"
          echo "${LLVM_ROOT}/bin" >> "${GITHUB_PATH}"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "${GITHUB_ENV}"
          echo "MAKEFLAGS=-j$(sysctl -n hw.ncpu)" >> "${GITHUB_ENV}"
          echo "CC=ccache clang" >> "${GITHUB_ENV}"
          echo "CXX=ccache clang++" >> "${GITHUB_ENV}"
          ccache --zero-stats

      - name: Set Linux environment
        if: runner.os == 'Linux'
        run: |
          echo "/usr/lib/ccache" >> "${GITHUB_PATH}"
          echo "LLVM_ROOT=/usr/lib/llvm-22" >> "${GITHUB_ENV}"
          echo "${LLVM_ROOT}/bin" >> "${GITHUB_PATH}"
          echo "MAKEFLAGS=-j$(nproc)" >> "${GITHUB_ENV}"
          echo "CC=ccache gcc" >> "${GITHUB_ENV}"
          echo "CXX=ccache g++" >> "${GITHUB_ENV}"
          ccache --zero-stats

      - name: Build and install core
        run: |
          pushd sst-core
          ./autogen.sh
          popd
          mkdir -p sst-core-build
          pushd sst-core-build
          ../sst-core/configure --prefix="${INSTALL_PREFIX}"
          make install
          popd

      - name: Build and install elements
        run: |
          pushd sst-elements
          ./autogen.sh
          popd
          mkdir -p sst-elements-build
          pushd sst-elements-build
          ../sst-elements/configure \
            --prefix="${INSTALL_PREFIX}" \
            --with-sst-core="${INSTALL_PREFIX}"
          make install
          popd

      - name: Build hgcc
        run: |
          export PATH="${INSTALL_PREFIX}/bin:${LLVM_ROOT}/bin:${PATH}"
          pushd sst-hgcc
          ./autogen.sh
          popd
          mkdir -p sst-hgcc-build
          pushd sst-hgcc-build
          ../sst-hgcc/configure \
            --prefix="${INSTALL_PREFIX}" \
            --with-sst-core="${INSTALL_PREFIX}" \
            --with-sst-elements="${INSTALL_PREFIX}" \
            --with-clang="${LLVM_ROOT}" \
            --with-std=17 \
            --enable-strict-tests \
            CC=clang \
            CXX=clang++
          make CC="ccache clang" CXX="ccache clang++"
          popd
          ccache --show-stats

      - name: Test hgcc
        run: |
          export PATH="${INSTALL_PREFIX}/bin:${LLVM_ROOT}/bin:${PATH}"
          pushd sst-hgcc-build
          make check
          popd

      - name: Upload hgcc test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hgcc-test-output-${{ matrix.os }}
          path: |
            sst-hgcc-build/tests/lit-junit.xml
            sst-hgcc/tests/lit-tests/Output
            sst-hgcc-build/tests/out.log
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 5
